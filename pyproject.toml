[project]
name = "asr-cli"
version = "0.1.0"
description = "A command-line interface for ASR (Automatic Speech Recognition)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "XBCoder128"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
asr-cli = "asr_cli.main:main"

[project.urls]
Homepage = "https://github.com/XBCoder128/asr-cli"
Repository = "https://github.com/XBCoder128/asr-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_cli"]

[tool.ruff]
line-length = 100
target-version = "py39"
