<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sayi</title>

    <!-- Instant shell — paint before CSS/JS bundles. Avoids white flash. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000000;
        color: #f5f5f7;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          "Hiragino Sans GB", "Helvetica Neue", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      html.light,
      html[data-theme="light"] {
        background: #f5f5f7;
        color: #1d1d1f;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        background: inherit;
        pointer-events: none;
        transition: opacity 0.22s ease;
      }
      #boot-shell[data-gone="1"] {
        opacity: 0;
      }
      #boot-shell .mark {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC",
          system-ui, sans-serif;
        font-size: 42px;
        letter-spacing: 0.02em;
        font-weight: 600;
        opacity: 0.92;
      }
      #boot-shell .rule {
        width: 28px;
        height: 1px;
        margin: 14px auto 0;
        background: currentColor;
        opacity: 0.28;
      }
      html[data-floating="1"] #boot-shell {
        display: none;
      }
    </style>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isFloating =
          params.get("window") === "floating" || window.__ASR_FLOATING__ === true;
        var theme = localStorage.getItem("asr-theme") === "light" ? "light" : "dark";
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute("data-theme", theme);
        if (isFloating) {
          document.documentElement.setAttribute("data-floating", "1");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="boot-shell" aria-hidden="true">
      <div>
        <div class="mark">Sayi</div>
        <div class="rule"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
