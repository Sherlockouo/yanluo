<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>言落 · Yanluo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var isFloating =
          params.get("window") === "floating" || window.__ASR_FLOATING__ === true;
        var theme = localStorage.getItem("asr-theme") === "light" ? "light" : "dark";
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute("data-theme", theme);
        if (isFloating) {
          document.documentElement.setAttribute("data-floating", "1");
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
