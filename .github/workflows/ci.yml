name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  rust:
    name: Rust check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            features: ""
            extra: qwen-local
            libtorch: ""
          - os: ubuntu-22.04
            features: ""
            extra: qwen-local
            libtorch: cpu
          - os: windows-latest
            features: ""
            extra: qwen-local
            libtorch: cpu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: matrix.libtorch != ''
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux WebKit deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev

      - name: Fetch libtorch
        if: matrix.libtorch != ''
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ matrix.libtorch }}" == "cuda" ]]; then EXTRA="--cuda"; fi
          node scripts/fetch-libtorch.mjs $EXTRA
          echo "LIBTORCH=${GITHUB_WORKSPACE}/src-tauri/libtorch" >> "$GITHUB_ENV"
          echo "LIBTORCH_BYPASS_VERSION_CHECK=1" >> "$GITHUB_ENV"

      - name: Check (default)
        working-directory: src-tauri
        run: cargo check ${{ matrix.features }}

      - name: Check (qwen-local)
        if: matrix.extra == 'qwen-local'
        working-directory: src-tauri
        env:
          LIBTORCH: ${{ env.LIBTORCH }}
          LIBTORCH_BYPASS_VERSION_CHECK: "1"
        run: cargo check --features qwen-local
