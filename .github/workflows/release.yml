name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          # productName is ASCII "Yanluo" (WiX/filenames). TCC / CFBundleDisplayName / menu = Yanluo; 言落 stays for zh locale copy.
          - platform: macos-aarch64
            os: macos-14
            args: --features qwen-local --bundles app,dmg
            libtorch: ""
          - platform: linux-x86_64
            os: ubuntu-22.04
            # CUDA libtorch → NVIDIA GPU when drivers present; CPU fallback at load.
            args: --config src-tauri/tauri.linux.conf.json --features qwen-local --bundles deb,appimage
            libtorch: cuda
          - platform: windows-x86_64
            os: windows-latest
            # Official Win CUDA link needs full VS+CUDA toolkit; ship CPU libtorch.
            # Local NVIDIA builds: node scripts/fetch-libtorch.mjs --cuda
            args: --config src-tauri/tauri.windows.conf.json --features qwen-local --bundles msi,nsis
            libtorch: cpu

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            if [[ "$VERSION" != "$PKG_VERSION" ]]; then
              echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
              echo "Bump package.json, run pnpm version:sync, commit, then tag v\$version"
              exit 1
            fi
            PUBLISH=true
          else
            TAG=""
            VERSION="$PKG_VERSION"
            PUBLISH=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$VERSION publish=$PUBLISH"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libasound2-dev

      - name: Fetch libtorch (Linux / Windows local Qwen)
        if: matrix.libtorch != ''
        shell: bash
        run: |
          EXTRA=""
          if [[ "${{ matrix.libtorch }}" == "cuda" ]]; then EXTRA="--cuda"; fi
          node scripts/fetch-libtorch.mjs $EXTRA
          echo "LIBTORCH=${GITHUB_WORKSPACE}/src-tauri/libtorch" >> "$GITHUB_ENV"
          echo "LIBTORCH_BYPASS_VERSION_CHECK=1" >> "$GITHUB_ENV"
          if [[ -d /usr/local/cuda/lib64 ]]; then
            echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          fi

      - name: Install CUDA toolkit (link CUDA libtorch)
        if: matrix.libtorch == 'cuda' && runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.23
        with:
          cuda: "12.6.0"
          method: network

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Sync Cargo / tauri.conf from package.json
        shell: bash
        run: pnpm version:sync && pnpm version:check

      - name: Build release notes from CHANGELOG
        if: steps.ver.outputs.publish == 'true'
        id: notes
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os
          import sys
          sys.stdout.reconfigure(encoding="utf-8")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = os.environ["VERSION"]
          lines = text.splitlines()
          out = []
          capture = False
          for line in lines:
              if line.startswith("## ["):
                  if capture:
                      break
                  if f"[{version}]" in line or f"[v{version}]" in line:
                      capture = True
                      out.append(line)
                      continue
              elif capture:
                  out.append(line)
          body = "\n".join(out).strip() or f"Yanluo v{version}"
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY
          {
            echo "body<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (tagged)
        if: steps.ver.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIBTORCH: ${{ env.LIBTORCH }}
          LIBTORCH_BYPASS_VERSION_CHECK: "1"
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: Yanluo ${{ steps.ver.outputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # Matrix jobs share the same tag and upload platform artifacts together.
          # In-app「检查更新」reads these Release assets via GitHub API.

      - name: Build only (manual / no tag)
        if: steps.ver.outputs.publish != 'true'
        shell: bash
        env:
          LIBTORCH: ${{ env.LIBTORCH }}
          LIBTORCH_BYPASS_VERSION_CHECK: "1"
          LD_LIBRARY_PATH: ${{ env.LD_LIBRARY_PATH }}
        run: pnpm tauri build ${{ matrix.args }}

      - name: Embed Gatekeeper fix into macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          PUBLISH: ${{ steps.ver.outputs.publish }}
        run: |
          node scripts/embed-gatekeeper-fix.mjs
          if [[ "$PUBLISH" == "true" && -n "$TAG" ]]; then
            shopt -s nullglob
            assets=(packaging/若打不开-点我.command src-tauri/target/release/bundle/dmg/*.dmg)
            gh release upload "$TAG" "${assets[@]}" --clobber
          fi
