[package]
name = "esaxx-rs"
version = "0.1.10"
authors = ["Nicolas Patry <patry.nicolas@protonmail.com>"]
edition = "2018"
description = "Wrapping around sentencepiece's esaxxx library."
license = "Apache-2.0"
homepage = "https://github.com/Narsil/esaxx-rs"
documentation = "https://docs.rs/esaxx-rs"
repository = "https://github.com/Narsil/esaxx-rs"
readme = "README.md"

# Vendored patch of esaxx-rs 0.1.10: build.rs no longer forces
# static_crt(true) — see build.rs for the MSVC /MT vs libtorch /MD fix.
# Dev-only bench/example targets trimmed (not needed as a path patch).

[dependencies]

[build-dependencies]
cc = { version = "1.0", optional = true}

[features]
default = ["cpp"]
cpp = ["cc"]
