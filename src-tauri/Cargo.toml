[package]
name = "yanluo"
version = "0.11.0"
description = "Desktop app for Qwen3-ASR, built with Tauri 2.0"
authors = ["Sherlockouo"]
edition = "2021"

[lib]
name = "yanluo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time", "rt", "net", "macros"] }
hound = "3.5"
reqwest = { version = "0.13.4", features = ["blocking", "json", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
libc = "0.2"
webrtc-vad = "0.4"
voice_activity_detector = { version = "0.2.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSColor", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSAppearance", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSAnimationContext", "NSAnimation", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSGeometry", "NSString"] }
block2 = "0.6"

# Qwen3-ASR — backend is platform-specific (features mutually exclusive upstream).
# macOS: MLX / Metal. Linux/Windows: libtorch (tch); CUDA if linked CUDA libtorch.
# Enable with `--features qwen-local`.
# Pin branch that exports init_streaming_with_context + pub chunk_id.
# Local path override while co-developing:
#   path = "../../qwen3_asr_rs"

[target.'cfg(target_os = "macos")'.dependencies.qwen3-asr-rs]
git = "https://github.com/XBCoder128/qwen3_asr_rs"
branch = "fix/asr-keep-punctuation"
default-features = false
features = ["mlx"]
optional = true

[target.'cfg(not(target_os = "macos"))'.dependencies.qwen3-asr-rs]
git = "https://github.com/XBCoder128/qwen3_asr_rs"
branch = "fix/asr-keep-punctuation"
default-features = false
features = ["tch-backend"]
optional = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
qwen-local = ["dep:qwen3-asr-rs"]
# Silero VAD (ONNX). Enable with: --features qwen-local,silero-vad
silero-vad = ["dep:voice_activity_detector"]
