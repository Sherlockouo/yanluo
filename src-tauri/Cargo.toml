[package]
name = "yanluo"
version = "0.9.0"
description = "Desktop app for Qwen3-ASR, built with Tauri 2.0"
authors = ["Sherlockouo"]
edition = "2021"

[lib]
name = "yanluo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }
hound = "3.5"
reqwest = { version = "0.13.4", features = ["blocking", "json", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
libc = "0.2"
webrtc-vad = "0.4"
voice_activity_detector = { version = "0.2.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSColor", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSAppearance", "NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSGeometry", "NSString"] }

# Qwen3-ASR Rust implementation (MLX — macOS).
# Enable with `--features qwen-local` (Apple Silicon recommended).
# Local path (has init_streaming_with_context + pub chunk_id).
# CI/release may pin git once main catches up:
#   git = "https://github.com/XBCoder128/qwen3_asr_rs"
#   branch = "main"
[dependencies.qwen3-asr-rs]
path = "../../qwen3_asr_rs"
default-features = false
features = ["mlx"]
optional = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
qwen-local = ["dep:qwen3-asr-rs"]
# Silero VAD (ONNX). Enable with: --features qwen-local,silero-vad
silero-vad = ["dep:voice_activity_detector"]
