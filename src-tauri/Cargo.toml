[package]
name = "asr-workshop"
version = "0.1.1"
description = "Desktop app for Qwen3-ASR, built with Tauri 2.0"
authors = ["you"]
edition = "2021"

[lib]
name = "asr_workshop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
tempfile = "3"
tokio = { version = "1", features = ["sync", "time"] }
hound = "3.5"
reqwest = { version = "0.13.4", features = ["blocking", "json", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
core-foundation = "0.10.1"
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSView", "NSColor", "NSGraphics", "NSPasteboard", "NSPasteboardItem", "NSAppearance"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }

# Qwen3-ASR Rust implementation (ForcedAligner branch, MLX — macOS).
# Enable with `--features qwen-local` (Apple Silicon recommended).
[dependencies.qwen3-asr-rs]
git = "https://github.com/Sherlockouo/qwen3_asr_rs"
branch = "feat/forced-aligner"
default-features = false
features = ["mlx"]
optional = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
qwen-local = ["dep:qwen3-asr-rs"]
